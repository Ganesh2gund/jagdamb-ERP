name: hotel_erp
description: Hotel ERP Management App - Premium mobile solution for hotel owners and managers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation
  go_router: ^13.2.0
  
  # State management
  provider: ^6.1.2
  
  # Charts
  fl_chart: ^0.68.0
  
  # Icons
  cupertino_icons: ^1.0.6
  
  # UI enhancements
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  http: ^1.2.1
  url_launcher: ^6.3.0

  # Google Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
